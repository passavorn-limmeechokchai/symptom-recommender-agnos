# Clinical vignettes: test cases for the engine.
#
# How to read this file. One case per `- id:` entry, under ── lines naming the chapter.
#   level              simple = typical case, every `expect` must pass;
#                      book = textbook case with a confirmed diagnosis; its rank is reported, no pass/fail
#   sex, age, chief_complaint
#   history            what the patient could tell the app
#     hpi              answers to chapter `hpi` questions, <symptom>.<question>: answer, in that question's
#                      unit (fever.duration in days, cough.duration in weeks, …); null = not known
#     present, absent  symptom and history ids answered yes / no
#     unmapped         facts from a book case that have no id in the knowledge base
#   expect             top3_includes / top3_includes_any = disease(s) that must rank in the top-3 DDx;
#                      ask_first / not_ask_first = questions that must / must not come before scoring;
#                      urgent = a gate must fire; never_recommend / never_in_ddx = sex and safety rules;
#                      duration_categories = categories a duration answer must map to (grey zones);
#                      switch_chief_complaint = the complaint must be re-routed
#   exam, book_ddx, final_diagnosis   book cases only: examination, the book's DDx, the final diagnosis
# Comments on `- id:` lines cite the book page.

