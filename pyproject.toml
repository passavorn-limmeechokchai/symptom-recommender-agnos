[project]
name = "symptom-recommender"
version = "0.3.0"
description = "Recommends the next symptoms to ask about, using a clinical-reasoning knowledge base and Agnos usage data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pythainlp>=5.4",
]

[project.optional-dependencies]
semantic = [
    "torch>=2.2",
    "transformers>=4.41,<6",
    "huggingface-hub>=0.24",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # FastAPI TestClient
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symptom_rec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
