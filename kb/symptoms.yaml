# Symptom dictionary: everything a patient can answer about.
#
# How to read this file. One entry per symptom, history item or home measurement, under ── lines
# naming a body system or the chapter that added it. Written from the sources only: it holds no
# Agnos vocabulary. Agnos names and answers are mapped to these ids at runtime by the normalizer,
# and that mapping is evaluated.
#
#   <id>:              the id that chapter files use
#     th, en           display names (source wording or standard medical terms)
#     kind             symptom | history (risk factor or exposure) | measurement (e.g. home blood pressure)
#     parent           the more general symptom this one makes specific
#     refines          the HPI answer that makes it specific, {question: answer}, matching the parent's
#                      `hpi` question in a chapter file (ruq_pain = abdominal_pain + location ruq)
#     aliases          other ways to say it; a comment gives the source (# p.N, # g.N, # eye.N, # ent.N,
#                      # uro.N, # reviewer); no comment = standard Thai written without looking at the data
#     sex              female | male -> never recommended to the other sex
#     red_flag         true -> asked before any scoring
#     urgent           true -> the patient should be seen now whenever it is present, whatever the
#                      chief complaint (no chapter needed)

