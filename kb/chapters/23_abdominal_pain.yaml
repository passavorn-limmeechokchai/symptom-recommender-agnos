  - {findings: [diabetes], suggests: [diabetic_ketoacidosis, pancreatitis]}  # p.253
  - {findings: [thalassemia], suggests: [gallstones]}  # p.253
  - {findings: [abdominal_surgery], suggests: [intestinal_obstruction]}  # p.253
  - {findings: [viral_hepatitis_history, past_jaundice], suggests: [hcc]}  # p.253
  - {findings: [family_history_gi_cancer], suggests: [colon_cancer, pancreatic_cancer]}  # p.253
  - {findings: [nsaid_use, gi_irritant_drug], suggests: [pud]}  # p.253
