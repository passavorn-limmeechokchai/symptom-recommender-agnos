# Disease registry shared by all chapter files.
#
# How to read this file. One entry per disease or disease group, under ── lines naming the chapter
# that first needed it. Where a disease sits in a DDx tree is set in each chapter file, because the
# same disease can sit under different branches in different chapters.
#
#   <id>:              the id that chapter files use
#     th, en           display names (internal; not shown to patients)
#     kind             disease | group (group = a category the source names with examples)
#     examples         for groups: what the source lists under it
#     sex              female | male -> never in the DDx for the other sex
#     must_not_miss    true -> dangerous if missed; its red-flag questions come first

